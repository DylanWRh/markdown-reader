<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{{ project_name }} · Markdown Reader</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script defer src="{{ url_for('static', filename='vendor/mermaid.min.js') }}"></script>
    <script defer src="{{ url_for('static', filename='vendor/mathjax/tex-svg.js') }}"></script>
    <script defer src="{{ url_for('static', filename='app.js') }}"></script>
  </head>
  <body data-project-name="{{ project_name }}" data-initial-file="{{ initial_file }}" data-workspace-token="{{ workspace_switch_token }}">
    <div class="reading-progress" id="readingProgress"></div>
    <header class="topbar">
      <div class="topbar-leading">
        <button class="icon-button mobile-only" id="openLeft" type="button" aria-label="打开项目目录">
          <span class="hamburger-icon" aria-hidden="true"></span>
        </button>
        <a class="brand" href="/" aria-label="Markdown Reader 首页">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="brand-name">Markdown Reader</span>
        </a>
        <span class="top-divider"></span>
        <nav class="breadcrumbs" id="breadcrumbs" aria-label="当前位置"></nav>
      </div>
      <div class="topbar-actions">
        <span class="reading-meta" id="readingMeta"></span>
        <div class="mode-switch" id="modeSwitch" role="group" aria-label="文档模式">
          <button class="mode-button active" id="readMode" type="button" aria-pressed="true">阅读</button>
          <button class="mode-button" id="editMode" type="button" aria-pressed="false" disabled>编辑</button>
        </div>
        <button class="secondary-button editor-action" id="cancelEdit" type="button" hidden>取消</button>
        <button class="primary-button editor-action" id="saveDocument" type="button" hidden>保存</button>
        <button class="icon-button" id="toggleAllSections" type="button" aria-label="折叠全部章节" title="折叠全部章节" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 9 4-4 4 4M8 15l4 4 4-4M5 12h14"/></svg>
        </button>
        <button class="icon-button" id="refreshDocument" type="button" aria-label="重新载入文档" title="重新载入">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></svg>
        </button>
        <button class="icon-button" id="toggleRight" type="button" aria-label="切换文章目录" title="文章目录">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
        </button>
      </div>
    </header>

    <div class="app-shell" id="appShell">
      <aside class="project-sidebar" id="projectSidebar" aria-label="项目目录">
        <div class="sidebar-header">
          <button class="workspace-trigger" id="openWorkspaceSwitcher" type="button" aria-haspopup="dialog" aria-label="切换工作区">
            <span class="workspace-trigger-copy">
              <span class="eyebrow">WORKSPACE</span>
              <strong id="workspaceName">{{ project_name }}</strong>
            </span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg>
          </button>
          <button class="icon-button sidebar-close mobile-only" id="closeLeft" type="button" aria-label="关闭项目目录">×</button>
        </div>
        <label class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="fileSearch" type="search" placeholder="搜索文件" autocomplete="off">
          <kbd>/</kbd>
        </label>
        <nav class="file-tree" id="fileTree" aria-label="项目文件"></nav>
        <footer class="sidebar-footer">
          <span class="status-dot"></span>
          <span>Local only</span>
          <span class="footer-separator">·</span>
          <span id="fileCount"></span>
        </footer>
      </aside>

      <main class="reader" id="reader" tabindex="-1">
        <section class="workspace-welcome" id="workspaceWelcome" {% if initial_file %}hidden{% endif %}>
          <span class="welcome-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="eyebrow">LOCAL MARKDOWN READER</span>
          <h1>选择一个工作区开始阅读</h1>
          <p>打开包含 Markdown 文件的本地目录。文档不会上传，也不会离开你的设备。</p>
          <button class="primary-button welcome-button" id="welcomeChooseWorkspace" type="button">选择工作区</button>
        </section>
        <div class="document-status" id="documentStatus" role="status" {% if not initial_file %}hidden{% endif %}>
          <span class="loading-spinner"></span><span>正在打开文档…</span>
        </div>
        <article class="markdown-body" id="documentContent"></article>
        <section class="editor-shell" id="editorShell" aria-label="Markdown 编辑器" hidden>
          <header class="editor-header">
            <div>
              <span class="editor-label">MARKDOWN SOURCE</span>
              <strong id="editorPath"></strong>
            </div>
            <span class="editor-state" id="editorState">未修改</span>
          </header>
          <textarea class="source-editor" id="sourceEditor" aria-label="Markdown 源码" spellcheck="false"></textarea>
          <footer class="editor-footer">
            <span>支持 Tab 缩进</span>
            <span><kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>S</kbd> 保存</span>
          </footer>
        </section>
        <footer class="document-footer" id="documentFooter" hidden>
          <span>End of document</span>
        </footer>
      </main>

      <aside class="toc-sidebar" id="tocSidebar" aria-label="文章目录">
        <div class="toc-heading">本页目录</div>
        <nav class="table-of-contents" id="tableOfContents"></nav>
        <div class="toc-bottom">
          <button class="back-to-top" id="backToTop" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
            回到顶部
          </button>
        </div>
      </aside>
    </div>

    <div class="mobile-scrim" id="mobileScrim"></div>
    <div class="modal-backdrop" id="workspaceBackdrop" hidden>
      <section class="workspace-dialog" role="dialog" aria-modal="true" aria-labelledby="workspaceDialogTitle">
        <header class="workspace-dialog-header">
          <div>
            <span class="eyebrow">LOCAL WORKSPACES</span>
            <h2 id="workspaceDialogTitle">切换工作区</h2>
          </div>
          <button class="icon-button workspace-close" id="closeWorkspaceSwitcher" type="button" aria-label="关闭工作区切换器">×</button>
        </header>
        <form class="workspace-form" id="workspaceForm">
          <label for="workspacePath">本地目录路径</label>
          <div class="workspace-input-row">
            <input id="workspacePath" type="text" autocomplete="off" spellcheck="false" placeholder="C:\\Users\\name\\Documents\\notes">
            <button class="secondary-button" id="browseWorkspace" type="button">浏览…</button>
            <button class="primary-button" id="switchWorkspace" type="submit">打开</button>
          </div>
          <p class="workspace-hint">输入包含 Markdown 文件的目录。内容只在本机读取。</p>
          <p class="workspace-error" id="workspaceError" role="alert" hidden></p>
        </form>
        <section class="directory-browser" id="directoryBrowser" hidden>
          <div class="directory-toolbar">
            <button class="icon-button directory-up" id="directoryUp" type="button" aria-label="返回上级目录" title="上级目录">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 15 4-4 4 4M12 11v8M5 5h14"/></svg>
            </button>
            <span class="directory-location" id="directoryLocation"></span>
          </div>
          <div class="directory-list" id="directoryList"></div>
          <footer class="directory-footer">
            <span id="directoryStatus"></span>
            <button class="primary-button" id="chooseCurrentDirectory" type="button">选择此目录</button>
          </footer>
        </section>
        <div class="recent-heading">最近使用</div>
        <div class="workspace-list" id="workspaceList"></div>
      </section>
    </div>
    <div class="link-preview" id="linkPreview" role="dialog" aria-live="polite" hidden>
      <div class="preview-topline">
        <span class="preview-type">文档预览</span>
        <span class="preview-path" id="previewPath"></span>
      </div>
      <div class="preview-content" id="previewContent"></div>
      <div class="preview-footer">点击前往 · Esc 关闭</div>
    </div>
    <div class="lightbox" id="lightbox" hidden>
      <button class="lightbox-close" type="button" aria-label="关闭图片预览">×</button>
      <img alt="">
    </div>
    <div class="toast" id="toast" role="status" hidden></div>
  </body>
</html>
